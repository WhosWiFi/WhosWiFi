<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Lookup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-text-color: #64ffda;
      --neon-border-color: #08f;
    }

    body {
      margin: 0;
      padding-top: 60px;
      background-color: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-text-color);
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      justify-content: stretch;
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .nav-links li {
      position: relative;
      flex: 1;
      text-align: center;
    }

    .nav-links li:not(:last-child)::after {
      content: "||";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-text-color);
      opacity: 0.5;
    }

    .nav-links a {
      color: var(--neon-text-color);
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      padding: 1rem 0;
      display: block;
      width: 100%;
    }

    .nav-links a:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .ip-display {
      background: rgba(100, 255, 218, 0.05);
      border: 1px solid var(--neon-text-color);
      padding: 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .ip-address {
      font-size: 2.5rem;
      margin: 1rem 0;
      text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .detail-card {
      background: rgba(100, 255, 218, 0.05);
      border: 1px solid var(--neon-text-color);
      padding: 1.5rem;
    }

    .detail-title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    .detail-value {
      font-size: 1.1rem;
      word-break: break-all;
    }

    .refresh-btn {
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      padding: 0.75rem 1.5rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .refresh-btn:hover {
      background: rgba(100, 255, 218, 0.2);
      text-shadow: 0 0 5px var(--neon-text-color);
      box-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--neon-text-color);
      cursor: pointer;
      padding: 0.5rem;
      font-family: 'Share Tech Mono', monospace;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .copy-btn:hover {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .ip-address {
        font-size: 1.8rem;
      }
      
      .details-grid {
        grid-template-columns: 1fr;
      }
    }

    .ip-section {
      margin: 1.5rem 0;
    }

    .ip-section h2 {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 0.5rem;
    }

    .ip-address {
      font-size: 1.8rem;
      margin: 0.5rem 0;
      text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
      word-break: break-all;
    }

    @media (max-width: 768px) {
      /* Fix navigation wrapping */
      .nav-links {
        flex-wrap: wrap;
      }

      .nav-links li {
        flex: 1 1 auto;
        min-width: 33.33%; /* Show 3 items per row */
      }

      /* Adjust terminal container */
      .terminal-container {
        height: calc(100vh - 120px); /* Account for wrapped nav */
        padding: 1rem;
      }

      /* Adjust terminal text container */
      .terminal-text {
        width: 95%;
        height: 60vh;
        padding: 1rem;
        transform: none; /* Remove perspective on mobile */
      }

      /* Adjust title */
      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }

      /* Adjust boot sequence text */
      .boot-sequence {
        font-size: 0.9rem;
      }

      /* Fix input area */
      .prompt-line {
        font-size: 0.9rem;
      }

      .prompt-line::before {
        margin-right: 0.5rem;
      }

      #terminal-input {
        font-size: 0.9rem;
      }
    }

    /* Fix iOS height issues */
    @supports (-webkit-touch-callout: none) {
      .terminal-container {
        height: -webkit-fill-available;
      }
    }

    .ascii-art-card {
      background: rgba(100, 255, 218, 0.05);
      border: 1px solid var(--neon-text-color);
      padding: 2rem;
      margin-top: 2rem;
      text-align: center;
      width: calc(100% - 4rem);
    }

    .ascii-animation {
      font-family: monospace;
      white-space: pre;
      margin: 0;
      color: var(--neon-text-color);
      text-shadow: 0 0 5px var(--neon-text-color);
      line-height: 1.2;
      font-size: 14px;
    }

    @keyframes neonPulse {
      0% { opacity: 0.7; text-shadow: 0 0 5px var(--neon-text-color); }
      50% { opacity: 1; text-shadow: 0 0 15px var(--neon-text-color); }
      100% { opacity: 0.7; text-shadow: 0 0 5px var(--neon-text-color); }
    }

    #wifi {
      animation: neonPulse 2s infinite;
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/apps">Apps</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/login">Login/Register</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="ip-display">
      <h1>Your IP Addresses</h1>
      <div class="ip-section">
        <h2>IPv4</h2>
        <div class="ip-address" id="ipv4-address">
          Loading...
        </div>
      </div>
      <div class="ip-section">
        <h2>IPv6</h2>
        <div class="ip-address" id="ipv6-address">
          Loading...
        </div>
      </div>
      <button class="refresh-btn" onclick="fetchIPInfo()">[ REFRESH ]</button>
    </div>
  </div>

  <div class="details-grid">
    <div class="ascii-art-card">
      <pre id="wifi" class="ascii-animation"></pre>
    </div>
  </div>

  <script>
    async function fetchIPInfo() {
      try {
        const response = await fetch('/api/ip');
        const data = await response.json();
        document.getElementById('ipv4-address').textContent = data.ipv4;
        document.getElementById('ipv6-address').textContent = data.ipv6;
      } catch (error) {
        console.error('Error fetching IP info:', error);
        document.getElementById('ipv4-address').textContent = 'Error loading IP';
        document.getElementById('ipv6-address').textContent = 'Error loading IP';
      }
    }

    const frames = [
      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║                                          ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │ │           │ │           │ │     ║
      ║     │ │           │ │           │ │     ║
      ║     │ │           │ │           │ │     ║
      ║     │█│           │ │           │ │     ║
      ║     └▼┘           └─┘           └─┘     ║
      ║    [▀▀▀]         [───]         [───]    ║
      ║   Scanning...    Waiting...     Idle     ║
      ╚══════════════════════════════════════════╝`,

      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║                                          ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │ │           │ │           │ │     ║
      ║     │ │           │ │           │ │     ║
      ║     │█│           │ │           │ │     ║
      ║     │█│           │ │           │ │     ║
      ║     └▼┘           └─┘           └─┘     ║
      ║    [███]         [───]         [───]    ║
      ║   Secured        Waiting...     Idle     ║
      ╚══════════════════════════════════════════╝`,

      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║                                          ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │ │           │ │           │ │     ║
      ║     │█│           │ │           │ │     ║
      ║     │█│           │ │           │ │     ║
      ║     │█│           │█│           │ │     ║
      ║     └▼┘           └▼┘           └─┘     ║
      ║    [███]         [▀▀▀]         [───]    ║
      ║   Secured        Scanning...    Idle     ║
      ╚══════════════════════════════════════════╝`,

      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║                                          ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │█│           │ │           │ │     ║
      ║     │█│           │█│           │ │     ║
      ║     │█│           │█│           │ │     ║
      ║     │█│           │█│           │ │     ║
      ║     └▼┘           └▼┘           └─┘     ║
      ║    [███]         [███]         [───]    ║
      ║   Secured        Secured        Idle     ║
      ╚══════════════════════════════════════════╝`,

      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║                                          ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │█│           │█│           │ │     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     └▼┘           └▼┘           └▼┘     ║
      ║    [███]         [███]         [▀▀▀]    ║
      ║   Secured        Secured       Scanning  ║
      ╚══════════════════════════════════════════╝`,

      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║                                          ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     └▼┘           └▼┘           └▼┘     ║
      ║    [███]         [███]         [███]    ║
      ║   Secured        Secured       Secured   ║
      ╚══════════════════════════════════════════╝`,

      `
      ╔══════════════ NETWORK SCAN ══════════════╗
      ║              ▀▄▄▄▄▄▄▄▀                  ║
      ║    STAGE 1        STAGE 2       STAGE 3  ║
      ║     ┌─┐           ┌─┐           ┌─┐     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     │█│           │█│           │█│     ║
      ║     └▼┘           └▼┘           └▼┘     ║
      ║    [███]         [███]         [███]    ║
      ║        * * * NETWORK SECURE * * *       ║
      ╚══════════════════════════════════════════╝`
    ];

    let currentFrame = 0;
    
    function animateWifi() {
      const wifi = document.getElementById('wifi');
      wifi.textContent = frames[currentFrame];
      currentFrame = (currentFrame + 1) % frames.length;
    }

    // Start animation
    setInterval(animateWifi, 800);
  </script>
</body>
</html>
