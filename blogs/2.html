<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-text-color: #64ffda;
      --neon-border-color: #08f;
    }

    body {
      margin: 0;
      padding-top: 60px;
      background-color: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-text-color);
    }
    
    nav {
      position: fixed;
      top: 0;
      width: 100vw;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      left: 0;
    }

    .nav-links {
      display: flex;
      justify-content: stretch;
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .nav-links li {
      position: relative;
      flex: 1;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .nav-links li:not(:last-child)::after {
      content: "||";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-text-color);
      opacity: 0.5;
    }

    .nav-links a {
      color: var(--neon-text-color);
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      padding: 1rem 0;
      display: block;
      width: 100%;
    }

    .nav-links a:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .blog-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .blog-post {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--neon-text-color);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 15px rgba(100, 255, 218, 0.1);
    }

    .blog-post-header {
      border-bottom: 1px solid rgba(100, 255, 218, 0.3);
      margin-bottom: 2rem;
      padding: 0 0 1rem 0;
    }

    .blog-post-title {
      font-size: 2rem;
      margin: 0 0 1rem 0;
      padding: 0;
      color: var(--neon-text-color);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .blog-post-meta {
      font-size: 0.9rem;
      color: rgba(100, 255, 218, 0.7);
      margin: 0;
      padding: 0;
    }

    .blog-post-content {
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .blog-post-tags {
      margin-top: 2rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(100, 255, 218, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 15px;
      font-size: 0.8rem;
    }

    .section {
      margin-bottom: 2rem;
    }

    h3 {
      color: var(--neon-text-color);
      text-shadow: 0 0 3px var(--neon-text-color);
      margin: 1.5rem 0 1rem;
      padding: 0;
    }

    code {
      background: rgba(100, 255, 218, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: 'Share Tech Mono', monospace;
    }

    pre {
      background: rgba(0, 0, 0, 0.5);
      padding: 1rem;
      border: 1px solid rgba(100, 255, 218, 0.3);
      overflow-x: auto;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="/apps">Apps</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="#shop">Shop</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a href="#login">Login/Register</a></li>
    </ul>
  </nav>

  <div class="blog-container">
    <article class="blog-post">
      <header class="blog-post-header">
        <h2 class="blog-post-title">Testing</h2>
        <div class="blog-post-meta">Posted by WhosWiFi | 2024-12-09</div>
      </header>
      <div class="blog-post-content">
        <p>Yes</p>

      </div>
      <div class="blog-post-tags">
        <span class="tag">yup</span>
      </div>
    </article>
  </div>
</body>
</html>
