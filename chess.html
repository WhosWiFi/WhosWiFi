<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <style>
        .game-container {
            display: flex;
            gap: 2rem;
            padding: 20px;
            align-items: flex-start;
            justify-content: center;
            margin-left: 50px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
        }

        #board {
            width: 640px;
            height: 640px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 2px solid #333;
        }

        .square {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .light { background-color: #eee; }
        .dark { background-color: #999; }
        .selected { background-color: #afd; }
        .valid-move { background-color: #fda; }

        .piece {
            font-size: 50px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 10px;
                width: 100%;
                box-sizing: border-box;
            }

            #board {
                width: 100vw;
                height: 100vw;
                max-width: 95vmin;
                max-height: 95vmin;
            }

            .square {
                width: auto;
                height: auto;
                touch-action: manipulation;
            }

            .piece {
                font-size: 7vmin;
                -webkit-user-select: none;
                user-select: none;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .control-btn {
                padding: 15px 25px;
                font-size: 16px;
            }
        }

        .difficulty-controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .control-btn {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            transition: background-color 0.3s;
        }

        .control-btn:hover {
            background-color: #eee;
        }

        .move-history {
            flex: none;
            background: #2c2c2c;
            padding: 15px;
            border-radius: 5px;
            margin-left: 20px;
            max-height: 640px;
            overflow-y: auto;
            width: 300px;
        }

        .move-history h3 {
            color: #fff;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        #moveList {
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .move-entry {
            padding: 5px;
            border-bottom: 1px solid #3a3a3a;
        }

        .move-entry.white {
            background: #363636;
        }

        .move-entry.black {
            background: #2c2c2c;
        }

        .move-entry.capture {
            color: #ff6b6b;
        }

        .move-entry.status {
            color: #ffd700;
            font-style: italic;
            text-align: center;
        }

        .controls-container {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .color-controls,
        .difficulty-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .color-controls h3,
        .difficulty-controls h3 {
            color: #fff;
            margin: 0;
            margin-bottom: 10px;
        }

        .control-btn {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            transition: background-color 0.3s;
            width: 100px;
        }

        .control-btn:hover {
            background-color: #eee;
        }

        .control-btn.active {
            background-color: #afd;
        }
    </style>
    <script src="/stockfish.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="controls-container">
            <div class="color-controls">
                <h3>Play as:</h3>
                <button class="control-btn" onclick="startNewGame('white')">White</button>
                <button class="control-btn" onclick="startNewGame('black')">Black</button>
            </div>
            <div class="difficulty-controls">
                <h3>Difficulty:</h3>
                <button class="control-btn" onclick="setDifficulty('easy')">Easy</button>
                <button class="control-btn" onclick="setDifficulty('medium')">Medium</button>
                <button class="control-btn" onclick="setDifficulty('hard')">Hard</button>
            </div>
        </div>
        <div class="board-container">
            <div id="board"></div>
            <div id="status"></div>
        </div>
        <div class="move-history">
            <h3>Move History</h3>
            <div id="moveList"></div>
        </div>
    </div>

    <script>
        class ChessGame {
            constructor() {
                this.board = {};
                this.currentPlayer = 'white';
                this.initializeBoard();
            }

            initializeBoard() {
                // Initialize white pieces
                this.board['A1'] = { type: 'rook', color: 'white', hasMoved: false };
                this.board['B1'] = { type: 'knight', color: 'white' };
                this.board['C1'] = { type: 'bishop', color: 'white' };
                this.board['D1'] = { type: 'queen', color: 'white' };
                this.board['E1'] = { type: 'king', color: 'white', hasMoved: false };
                this.board['F1'] = { type: 'bishop', color: 'white' };
                this.board['G1'] = { type: 'knight', color: 'white' };
                this.board['H1'] = { type: 'rook', color: 'white', hasMoved: false };

                for (let file of 'ABCDEFGH') {
                    this.board[file + '2'] = { type: 'pawn', color: 'white', hasMoved: false };
                }

                // Initialize black pieces
                this.board['A8'] = { type: 'rook', color: 'black', hasMoved: false };
                this.board['B8'] = { type: 'knight', color: 'black' };
                this.board['C8'] = { type: 'bishop', color: 'black' };
                this.board['D8'] = { type: 'queen', color: 'black' };
                this.board['E8'] = { type: 'king', color: 'black', hasMoved: false };
                this.board['F8'] = { type: 'bishop', color: 'black' };
                this.board['G8'] = { type: 'knight', color: 'black' };
                this.board['H8'] = { type: 'rook', color: 'black', hasMoved: false };

                for (let file of 'ABCDEFGH') {
                    this.board[file + '7'] = { type: 'pawn', color: 'black', hasMoved: false };
                }
            }

            isValidMove(from, to) {
                const piece = this.board[from];
                if (!piece || piece.color !== this.currentPlayer) return false;
                
                // Can't capture your own pieces
                if (this.board[to] && this.board[to].color === piece.color) return false;

                const [fromFile, fromRank] = [from.charCodeAt(0) - 65, parseInt(from[1])];
                const [toFile, toRank] = [to.charCodeAt(0) - 65, parseInt(to[1])];
                const fileDiff = Math.abs(toFile - fromFile);
                const rankDiff = Math.abs(toRank - fromRank);

                switch (piece.type) {
                    case 'pawn':
                        const direction = piece.color === 'white' ? 1 : -1;
                        
                        // Forward movement (no capture)
                        if (fileDiff === 0 && !this.board[to]) {
                            // Normal one square forward move
                            if (rankDiff === 1 && (toRank - fromRank) === direction) {
                                return true;
                            }
                            // First move - two squares forward
                            if (!piece.hasMoved && rankDiff === 2 && 
                                (toRank - fromRank) === 2 * direction) {
                                const middleSquare = from[0] + (parseInt(from[1]) + direction);
                                return !this.board[middleSquare];
                            }
                        }
                        
                        // Diagonal capture
                        if (fileDiff === 1 && rankDiff === 1 && 
                            (toRank - fromRank) === direction) {
                            return this.board[to] && this.board[to].color !== piece.color;
                        }
                        return false;

                    case 'knight':
                        // L-shaped movement (2+1)
                        return (fileDiff === 2 && rankDiff === 1) || 
                               (fileDiff === 1 && rankDiff === 2);

                    case 'bishop':
                        // Diagonal movement only
                        if (fileDiff !== rankDiff) return false;
                        return this.isDiagonalPathClear(from, to);

                    case 'rook':
                        // Horizontal or vertical movement only
                        if (fileDiff !== 0 && rankDiff !== 0) return false;
                        return this.isStraightPathClear(from, to);

                    case 'queen':
                        // Combination of bishop and rook movements
                        if (fileDiff === rankDiff) return this.isDiagonalPathClear(from, to);
                        if (fileDiff === 0 || rankDiff === 0) return this.isStraightPathClear(from, to);
                        return false;

                    case 'king':
                        // One square in any direction
                        return fileDiff <= 1 && rankDiff <= 1;
                }
                return false;
            }

            makeMove(from, to) {
                if (!this.isValidMove(from, to)) return false;
                
                const piece = this.board[from];
                const capturedPiece = this.board[to];
                
                // Make the move
                this.board[to] = piece;
                delete this.board[from];
                
                // Add move to history
                this.addMoveToHistory(from, to, piece, capturedPiece);
                
                // Update game state
                this.currentPlayer = this.currentPlayer === 'white' ? 'black' : 'white';
                return true;
            }

            isDiagonalPathClear(from, to) {
                const [fromFile, fromRank] = [from.charCodeAt(0) - 65, parseInt(from[1])];
                const [toFile, toRank] = [to.charCodeAt(0) - 65, parseInt(to[1])];
                const fileDir = Math.sign(toFile - fromFile);
                const rankDir = Math.sign(toRank - fromRank);

                let currentFile = fromFile + fileDir;
                let currentRank = fromRank + rankDir;

                while (currentFile !== toFile && currentRank !== toRank) {
                    const square = String.fromCharCode(currentFile + 65) + currentRank;
                    if (this.board[square]) return false;
                    currentFile += fileDir;
                    currentRank += rankDir;
                }
                return true;
            }

            isStraightPathClear(from, to) {
                const [fromFile, fromRank] = [from.charCodeAt(0), parseInt(from[1])];
                const [toFile, toRank] = [to.charCodeAt(0), parseInt(to[1])];

                if (fromFile === toFile) {
                    const dir = Math.sign(toRank - fromRank);
                    for (let rank = fromRank + dir; rank !== toRank; rank += dir) {
                        if (this.board[String.fromCharCode(fromFile) + rank]) return false;
                    }
                } else {
                    const dir = Math.sign(toFile - fromFile);
                    for (let file = fromFile + dir; file !== toFile; file += dir) {
                        if (this.board[String.fromCharCode(file) + fromRank]) return false;
                    }
                }
                return true;
            }

            addMoveToHistory(from, to, piece, capturedPiece) {
                const moveList = document.getElementById('moveList');
                const moveEntry = document.createElement('div');
                moveEntry.className = `move-entry ${piece.color}`;
                
                let description;
                if (capturedPiece) {
                    description = `${piece.color === 'white' ? 'White' : 'Black'} ${piece.type.charAt(0).toUpperCase() + piece.type.slice(1)} ${from} takes ${capturedPiece.type.charAt(0).toUpperCase() + capturedPiece.type.slice(1)} ${to}`;
                    moveEntry.className += ' capture';
                } else {
                    description = `${piece.color === 'white' ? 'White' : 'Black'} ${piece.type.charAt(0).toUpperCase() + piece.type.slice(1)} ${from} to ${to}`;
                }
                
                moveEntry.textContent = description;
                moveList.appendChild(moveEntry);
                
                if (this.gameStatus === 'check' || this.gameStatus === 'checkmate') {
                    const statusEntry = document.createElement('div');
                    statusEntry.className = `move-entry status ${piece.color}`;
                    statusEntry.textContent = this.gameStatus === 'check' ? 'Check!' : 'Checkmate!';
                    moveList.appendChild(statusEntry);
                }
                
                moveList.scrollTop = moveList.scrollHeight;
            }

            clearMoveHistory() {
                const moveList = document.getElementById('moveList');
                if (moveList) {
                    moveList.innerHTML = '';
                }
            }
        }

        let game;
        let selectedSquare = null;
        let engine = null;
        let playerColor = 'white';
        let isPlayerTurn = true;
        let currentDifficulty = 'medium';
        const difficultySettings = {
            easy: {
                skillLevel: 2,
                moveTime: 500,
                moveDelay: 5000
            },
            medium: {
                skillLevel: 10,
                moveTime: 750,
                moveDelay: 3000
            },
            hard: {
                skillLevel: 20,
                moveTime: 1000,
                moveDelay: 500
            }
        };

        function initializeEngine() {
            engine = new Worker('/stockfish.js');
            engine.onmessage = function(event) {
                const message = event.data;
                if (message.startsWith('bestmove')) {
                    const move = message.split(' ')[1];
                    const from = move.substring(0, 2).toUpperCase();
                    const to = move.substring(2, 4).toUpperCase();
                    
                    // Add delay based on difficulty
                    setTimeout(() => {
                        if (game.makeMove(from, to)) {
                            createBoard();
                            isPlayerTurn = true;
                            updateStatus();
                        }
                    }, difficultySettings[currentDifficulty].moveDelay);
                }
            };
            
            engine.postMessage('uci');
            engine.postMessage('isready');
            engine.postMessage('ucinewgame');
            engine.postMessage(`setoption name Skill Level value ${difficultySettings[currentDifficulty].skillLevel}`);
        }

        function startNewGame(color) {
            playerColor = color;
            game = new ChessGame();
            selectedSquare = null;
            isPlayerTurn = (color === 'white');
            createBoard();
            updateStatus();

            if (color === 'black') {
                makeEngineMove();
            }
        }

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            // Determine rank order based on player color
            const ranks = playerColor === 'white' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
            const files = playerColor === 'white' ? 'ABCDEFGH' : 'HGFEDCBA';

            for (let rank of ranks) {
                for (let file of files) {
                    const square = document.createElement('div');
                    const notation = file + rank;
                    square.className = `square ${(file.charCodeAt(0) + rank) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.square = notation;

                    const piece = game.board[notation];
                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `piece ${piece.color}`;
                        pieceDiv.textContent = getPieceSymbol(piece);
                        square.appendChild(pieceDiv);
                    }

                    square.addEventListener('click', handleSquareClick);
                    board.appendChild(square);
                }
            }
        }

        function handleSquareClick(event) {
            event.preventDefault(); // Prevent double-tap zoom
            if (!isPlayerTurn) return;

            const square = event.currentTarget;
            const notation = square.dataset.square;

            // Clear all previous highlights
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('selected', 'valid-move');
            });

            // If clicking a new piece of player's color
            const piece = game.board[notation];
            if (piece && piece.color === playerColor) {
                selectedSquare = notation;
                square.classList.add('selected');
                
                // Show valid moves for this piece
                const files = 'ABCDEFGH';
                const ranks = '12345678';
                
                for (let file of files) {
                    for (let rank of ranks) {
                        const targetSquare = file + rank;
                        if (game.isValidMove(notation, targetSquare)) {
                            const validSquare = document.querySelector(`[data-square="${targetSquare}"]`);
                            if (validSquare) {
                                validSquare.classList.add('valid-move');
                            }
                        }
                    }
                }
                return;
            }

            // If a piece was previously selected and clicking a valid move square
            if (selectedSquare) {
                if (game.makeMove(selectedSquare, notation)) {
                    createBoard();
                    isPlayerTurn = false;
                    updateStatus();
                    setTimeout(makeEngineMove, 500);
                }
                selectedSquare = null;
            }
        }

        function makeEngineMove() {
            const fen = getCurrentFEN();
            engine.postMessage(`position fen ${fen}`);
            engine.postMessage(`go movetime ${difficultySettings[currentDifficulty].moveTime}`);
        }

        function getCurrentFEN() {
            let fen = '';
            let emptyCount = 0;
            
            for (let rank = 8; rank >= 1; rank--) {
                for (let file of 'ABCDEFGH') {
                    const piece = game.board[file + rank];
                    if (piece) {
                        if (emptyCount > 0) {
                            fen += emptyCount;
                            emptyCount = 0;
                        }
                        const symbol = getPieceFENSymbol(piece);
                        fen += symbol;
                    } else {
                        emptyCount++;
                    }
                }
                if (emptyCount > 0) {
                    fen += emptyCount;
                    emptyCount = 0;
                }
                if (rank > 1) fen += '/';
            }
            
            fen += ` ${game.currentPlayer.charAt(0)} - - 0 1`;
            return fen;
        }

        function getPieceSymbol(piece) {
            const symbols = {
                white: { king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙' },
                black: { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
            };
            return symbols[piece.color][piece.type];
        }

        function getPieceFENSymbol(piece) {
            const symbols = {
                king: 'k', queen: 'q', rook: 'r',
                bishop: 'b', knight: 'n', pawn: 'p'
            };
            let symbol = symbols[piece.type];
            return piece.color === 'white' ? symbol.toUpperCase() : symbol;
        }

        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `Current turn: ${game.currentPlayer.toUpperCase()}`;
        }

        function setDifficulty(difficulty) {
            currentDifficulty = difficulty;
            engine.postMessage(`setoption name Skill Level value ${difficultySettings[difficulty].skillLevel}`);
            
            // Update visual feedback
            document.querySelectorAll('.difficulty-controls .control-btn').forEach(btn => {
                btn.style.backgroundColor = btn.textContent.toLowerCase() === difficulty ? '#afd' : '';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeEngine();
            startNewGame('white');

            // Prevent zoom on double tap
            document.addEventListener('touchend', (e) => {
                e.preventDefault();
            }, { passive: false });
        });
    </script>
</body>
</html>
