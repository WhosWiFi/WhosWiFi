<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5em;
            position: absolute;
            top: 20px;
            margin: 0;
        }

        .game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        .score-board {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
        }

        canvas {
            background-color: #2d2d2d;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            width: auto;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="700" height="700"></canvas>
        <div class="score-board">
            <div class="score">Score: <span id="currentScore">0</span></div>
            <div class="high-score">High Score: <span id="highScore">0</span></div>
        </div>
    </div>
    <script>
        // Get canvas context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Updated game settings
        const gridSize = 35;  // Adjusted for 700x700 canvas
        const tileCount = canvas.width / gridSize;
        const gameSpeed = 150;  // Constant speed that won't change
        let highScore = 0;
        
        // Updated colors
        const colors = {
            background: '#2d2d2d',
            snake: {
                head: '#4CAF50',
                body: '#388E3C'
            },
            food: '#FF5252',
            grid: '#333333'
        };
        
        // Snake initial position and velocity
        let snake = [{x: 10, y: 10}];
        let dx = 0;
        let dy = 0;
        
        // Food position
        let foodX = Math.floor(Math.random() * tileCount);
        let foodY = Math.floor(Math.random() * tileCount);
        
        // Score
        let score = 0;
        
        // Game loop
        function gameLoop() {
            updateGame();
            drawGame();
            setTimeout(gameLoop, gameSpeed);
        }
        
        // Update game state
        function updateGame() {
            if (dx === 0 && dy === 0) return;  // Don't update if not moving
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                generateFood();
            } else {
                snake.pop();
            }
            
            if (head.x < 0 || head.x >= tileCount || 
                head.y < 0 || head.y >= tileCount ||
                checkCollision()) {
                resetGame();
            }
        }
        
        // Draw game elements
        function drawGame() {
            // Draw background
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            for(let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Draw snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? colors.snake.head : colors.snake.body;
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * gridSize + 1, 
                    segment.y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2,
                    8
                );
                ctx.fill();
            });
            
            // Draw food
            ctx.fillStyle = colors.food;
            ctx.beginPath();
            ctx.roundRect(
                foodX * gridSize + 1, 
                foodY * gridSize + 1, 
                gridSize - 2, 
                gridSize - 2,
                8
            );
            ctx.fill();
            
            // Update score displays
            document.getElementById('currentScore').textContent = score;
            document.getElementById('highScore').textContent = highScore;
        }
        
        // Generate new food position
        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
        }
        
        // Check if snake collides with itself
        function checkCollision() {
            return snake.slice(1).some(segment => 
                segment.x === snake[0].x && segment.y === snake[0].y
            );
        }
        
        // Reset game state
        function resetGame() {
            if (score > highScore) {
                highScore = score;
            }
            snake = [{x: Math.floor(tileCount/2), y: Math.floor(tileCount/2)}];
            dx = 0;
            dy = 0;
            score = 0;
            generateFood();
        }
        
        // Handle keyboard input
        document.addEventListener('keydown', (event) => {
            // Prevent arrow keys from scrolling the page
            if (event.key.startsWith('Arrow')) {
                event.preventDefault();
            }
            
            switch(event.key) {
                case 'ArrowUp':
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        });
        
        // Start the game
        gameLoop();
    </script>
</body>
</html>
