<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register - WhosWiFi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-text-color: #64ffda;
      --neon-border-color: #08f;
    }

    body {
      margin: 0;
      padding-top: 60px;
      background-color: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-text-color);
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      justify-content: stretch;
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .nav-links li {
      position: relative;
      flex: 1;
      text-align: center;
    }

    .nav-links li:not(:last-child)::after {
      content: "||";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-text-color);
      opacity: 0.5;
    }

    .nav-links a {
      color: var(--neon-text-color);
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      padding: 1rem 0;
      display: block;
      width: 100%;
    }

    .nav-links a:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .auth-container {
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .auth-tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      color: var(--neon-text-color);
      background: transparent;
      border: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .auth-form {
      background: rgba(0, 0, 0, 0.3);
      padding: 2rem;
      border: 1px solid var(--neon-text-color);
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.5rem;
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      font-family: 'Share Tech Mono', monospace;
    }

    .form-group input:focus {
      outline: none;
      box-shadow: 0 0 5px var(--neon-text-color);
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: transparent;
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .security-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
    }

    .error-message {
      color: #ff4444;
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: 1px solid #ff4444;
      display: none;
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/apps">Apps</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/login">Login/Register</a></li>
    </ul>
  </nav>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">[ LOGIN ]</button>
      <button class="auth-tab" onclick="switchTab('register')">[ REGISTER ]</button>
    </div>

    <div class="error-message" id="error-message"></div>

    <form class="auth-form active" id="login-form">
      <div class="form-group">
        <label for="login-username">Username:</label>
        <input type="text" id="login-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password" required>
      </div>
      <button type="submit" class="submit-btn">[ AUTHENTICATE ]</button>
    </form>

    <form class="auth-form" id="register-form">
      <div class="form-group">
        <label for="register-username">Username:</label>
        <input type="text" id="register-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="register-email">Email:</label>
        <input type="email" id="register-email" name="email" required>
      </div>
      <div class="form-group">
        <label for="register-password">Password:</label>
        <input type="password" id="register-password" name="password" required>
      </div>
      <div class="form-group">
        <label for="register-confirm">Confirm Password:</label>
        <input type="password" id="register-confirm" name="confirm" required>
      </div>
      <button type="submit" class="submit-btn">[ CREATE ACCOUNT ]</button>
    </form>
  </div>

  <script>
    function switchTab(tab) {
      // Update tab buttons
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      // Update forms
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.getElementById('login-form').classList.add('active');
      } else {
        document.getElementById('register-form').classList.add('active');
      }
    }

    // Handle form submissions
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Add your login logic here
      console.log('Login attempt:', {
        username: document.getElementById('login-username').value,
        password: document.getElementById('login-password').value
      });
    });

    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Add your registration logic here
      if (document.getElementById('register-password').value !== 
          document.getElementById('register-confirm').value) {
        showError('Passwords do not match');
        return;
      }
      console.log('Registration attempt:', {
        username: document.getElementById('register-username').value,
        email: document.getElementById('register-email').value,
        password: document.getElementById('register-password').value
      });
    });

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
