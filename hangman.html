<!DOCTYPE html>
<html>
<head>
  <title>Hangman</title>
  <style>
    body {
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1a1a1a;
      color: #64ffd9;
    }
    
    #game-container {
      text-align: center;
      margin-top: 2rem;
    }
    
    #word-display {
      font-size: 2.5rem;
      letter-spacing: 0.5rem;
      margin: 2rem 0;
    }
    
    #guesses {
      font-size: 1.2rem;
      margin: 1rem 0;
    }
    
    #guess-input {
      font-size: 1.2rem;
      width: 30px;
      text-align: center;
      background: transparent;
      border: 2px solid #64ffd9;
      color: #64ffd9;
      padding: 5px;
      margin: 1rem 0;
    }
    
    #message {
      font-size: 1.5rem;
      margin: 1rem 0;
      min-height: 2rem;
    }
    
    button {
      font-family: 'Share Tech Mono', monospace;
      background: transparent;
      border: 2px solid #64ffd9;
      color: #64ffd9;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      margin: 0.5rem;
    }
    
    button:hover {
      background: rgba(100, 255, 217, 0.1);
    }
    
    #hangman-drawing {
      font-family: monospace;
      white-space: pre;
      margin: 2rem 0;
    }
    
    .game-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-top: 1rem;
    }

    .difficulty-buttons {
        display: flex;
        gap: 0.5rem;
    }

    .difficulty-buttons button {
        font-size: 0.8rem;
    }

    .difficulty-buttons button.active {
        background: rgba(100, 255, 217, 0.3);
    }
  </style>
</head>
<body>
  <h1>Hangman</h1>
  <div id="game-container">
    <div id="hangman-drawing"></div>
    <div id="word-display"></div>
    <div id="guesses">Guessed letters: </div>
    <input type="text" id="guess-input" maxlength="1" />
    <div id="message"></div>
    <div class="game-controls">
        <button id="new-game">New Game</button>
        <div class="difficulty-buttons">
            <button id="easy-mode">Easy</button>
            <button id="medium-mode">Medium</button>
            <button id="hard-mode">Hard</button>
        </div>
    </div>
  </div>

  <script>
    let word = '';
    let guessedLetters = new Set();
    let remainingGuesses = 6;
    let difficulty = 'medium';
    
    const hangmanStagesHard = [
        `
  +---+
  |   |
      |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /    |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`
    ];

    const hangmanStagesMedium = [
        `
      
      
      |
      |
      |
      |
=========`,
        `
  +---+
      |
      |
      |
      |
      |
=========`,
        `
  +---+
  |   |
      |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /    |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`
    ];

    const hangmanStagesEasy = [
        `
      
      
      |
      |
      |
      |
=========`,
        `
      
      |
      |
      |
      |
      |
=========`,
        `
  +   
      |
      |
      |
      |
      |
=========`,
        `
  +---+
      |
      |
      |
      |
      |
=========`,
        `
  +---+
  |   |
      |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  |   |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
      |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /    |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
        `
  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`
    ];

    async function getNewWord() {
      try {
        const response = await fetch('/api/word');
        const data = await response.json();
        return data.word.toLowerCase();
      } catch (error) {
        console.error('Error fetching word:', error);
        return 'error';
      }
    }

    function updateDisplay() {
      const display = word
        .split('')
        .map(letter => guessedLetters.has(letter) ? letter : '_')
        .join(' ');
      document.getElementById('word-display').textContent = display;
      
      document.getElementById('guesses').textContent = 
        'Guessed letters: ' + Array.from(guessedLetters).join(', ');
      
      let stages;
      switch(difficulty) {
          case 'easy': stages = hangmanStagesEasy; break;
          case 'medium': stages = hangmanStagesMedium; break;
          default: stages = hangmanStagesHard;
      }
      
      document.getElementById('hangman-drawing').textContent = 
        stages[getDifficultyGuesses() - remainingGuesses];
    }

    async function startNewGame() {
      word = await getNewWord();
      guessedLetters.clear();
      remainingGuesses = getDifficultyGuesses();
      document.getElementById('message').textContent = '';
      document.getElementById('guess-input').value = '';
      document.getElementById('guess-input').disabled = false;
      updateDisplay();
    }

    function makeGuess(letter) {
      if (letter.length !== 1) return;
      letter = letter.toLowerCase();
      
      if (guessedLetters.has(letter)) {
        document.getElementById('message').textContent = 'You already guessed that letter!';
        return;
      }
      
      guessedLetters.add(letter);
      
      if (!word.includes(letter)) {
        remainingGuesses--;
      }
      
      updateDisplay();
      
      // Check win/lose conditions
      if (remainingGuesses === 0) {
        document.getElementById('message').textContent = `Game Over! The word was: ${word}`;
        document.getElementById('guess-input').disabled = true;
      } else if ([...word].every(letter => guessedLetters.has(letter))) {
        document.getElementById('message').textContent = 'Congratulations! You won!';
        document.getElementById('guess-input').disabled = true;
      }
    }

    function getDifficultyGuesses() {
        switch(difficulty) {
            case 'easy': return 12;
            case 'medium': return 9;
            default: return 6;
        }
    }

    // Event Listeners
    document.getElementById('new-game').addEventListener('click', startNewGame);
    
    document.getElementById('guess-input').addEventListener('keyup', (event) => {
      if (event.key === 'Enter' && event.target.value) {
        makeGuess(event.target.value);
        event.target.value = '';
      }
    });

    // Add difficulty selection logic
    function setDifficulty(newDifficulty) {
        difficulty = newDifficulty;
        document.querySelectorAll('.difficulty-buttons button').forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(`${newDifficulty}-mode`).classList.add('active');
        startNewGame();
    }

    // Add difficulty button listeners
    document.getElementById('easy-mode').addEventListener('click', () => setDifficulty('easy'));
    document.getElementById('medium-mode').addEventListener('click', () => setDifficulty('medium'));
    document.getElementById('hard-mode').addEventListener('click', () => setDifficulty('hard'));

    // Set initial active difficulty
    document.getElementById('medium-mode').classList.add('active');

    // Start first game
    startNewGame();
  </script>
</body>
</html>
