<!DOCTYPE html>
<html>
<head>
  <title>Space Marine</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Set canvas size to window size
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game objects
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 60,
      width: 50,
      height: 50,
      speed: 5
    };

    let bullets = [];
    let enemies = [];
    let keys = {};
    let explosions = [];

    // Game state
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let powerUps = [];
    let enemyPatterns = [
      { type: 'zigzag', points: 10 },
      { type: 'dive', points: 20 },
      { type: 'swoop', points: 30 }
    ];

    // Power-up types
    const POWERUP_TYPES = {
      DOUBLE_SHOT: { color: 'blue', duration: 5000 },
      SHIELD: { color: 'purple', duration: 8000 },
      SPEED_BOOST: { color: 'orange', duration: 4000 }
    };

    // Add to player object
    player.powerUps = {
      doubleShot: false,
      shield: false,
      speedBoost: false
    };

    // Handle keyboard input
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      // Prevent space bar from scrolling
      if(e.code === 'Space') {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function spawnEnemy() {
      const patternIndex = Math.floor(Math.random() * enemyPatterns.length);
      const pattern = enemyPatterns[patternIndex];
      const enemy = {
        x: Math.random() * (canvas.width - 40),
        y: 0,
        width: 40,
        height: 40,
        speed: 2,
        pattern: pattern.type,
        points: pattern.points,
        angle: 0
      };
      enemies.push(enemy);
    }

    function spawnPowerUp() {
      if (Math.random() < 0.005) {
        const types = Object.keys(POWERUP_TYPES);
        const type = types[Math.floor(Math.random() * types.length)];
        const powerUp = {
          x: Math.random() * (canvas.width - 20),
          y: 0,
          width: 20,
          height: 20,
          speed: 1,
          type: type
        };
        powerUps.push(powerUp);
      }
    }

    function applyPowerUp(type) {
      player.powerUps[type.toLowerCase()] = true;
      setTimeout(() => {
        player.powerUps[type.toLowerCase()] = false;
      }, POWERUP_TYPES[type].duration);
    }

    function shoot() {
      const createBullet = (offsetX = 0) => ({
        x: player.x + player.width / 2 - 2 + offsetX,
        y: player.y,
        width: 4,
        height: 10,
        speed: 7
      });

      if (player.powerUps.doubleShot) {
        bullets.push(createBullet(-10));
        bullets.push(createBullet(10));
      } else {
        bullets.push(createBullet());
      }
    }

    function createExplosion(x, y) {
      const particleCount = 15;
      for (let i = 0; i < particleCount; i++) {
        explosions.push({
          x: x,
          y: y,
          dx: (Math.random() - 0.5) * 8,
          dy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 3 + 1,
          life: 1, // Life from 1 to 0
          color: 'orange'
        });
      }
    }

    function update() {
      if (gameOver) {
        return;
      }

      // Player movement with speed boost
      const currentSpeed = player.powerUps.speedBoost ? player.speed * 1.5 : player.speed;
      if ((keys['ArrowLeft'] || keys['a']) && player.x > 0) {
        player.x -= currentSpeed;
      }
      if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - player.width) {
        player.x += currentSpeed;
      }
      if (keys[' ']) {
        shoot();
      }

      // Update power-ups
      powerUps = powerUps.filter(powerUp => {
        powerUp.y += powerUp.speed;
        
        // Check collision with player
        if (collision(player, powerUp)) {
          applyPowerUp(powerUp.type);
          return false;
        }
        
        return powerUp.y < canvas.height;
      });

      // Update enemies with patterns
      enemies = enemies.filter(enemy => {
        switch(enemy.pattern) {
          case 'zigzag':
            enemy.x += Math.sin(enemy.angle) * 2;
            enemy.angle += 0.05;
            break;
          case 'dive':
            if (enemy.y < canvas.height * 0.2) {
              enemy.y += enemy.speed;
            } else {
              enemy.y += enemy.speed * 2;
              enemy.x += (player.x > enemy.x ? 1 : -1) * 2;
            }
            return enemy.y < canvas.height;
          case 'swoop':
            enemy.y += enemy.speed;
            enemy.x += Math.cos(enemy.y * 0.02) * 3;
            break;
        }
        enemy.y += enemy.speed;
        return enemy.y < canvas.height;
      });

      // Collision detection with player
      if (!player.powerUps.shield) {
        const playerHit = enemies.some(enemy => collision(player, enemy));
        if (playerHit) {
          lives--;
          createExplosion(player.x + player.width/2, player.y + player.height/2);
          if (lives <= 0) {
            gameOver = true;
          }
          // Reset enemy positions
          enemies = [];
          // Reset player position
          player.x = canvas.width / 2;
          player.y = canvas.height - 60;
        }
      }

      // Update bullets
      bullets = bullets.filter(bullet => {
        bullet.y -= bullet.speed;
        return bullet.y > 0;
      });

      // Collision detection
      enemies = enemies.filter(enemy => {
        const hitByBullet = bullets.some(bullet => {
          if (collision(bullet, enemy)) {
            bullets = bullets.filter(b => b !== bullet);
            score += enemy.points;
            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
            return true;
          }
          return false;
        });
        return !hitByBullet;
      });

      spawnPowerUp();

      // Add explosion update logic to the update function
      explosions = explosions.filter(explosion => {
        explosion.x += explosion.dx;
        explosion.y += explosion.dy;
        explosion.life -= 0.02;
        return explosion.life > 0;
      });
    }

    function collision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameOver) {
        ctx.fillStyle = 'white';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '24px Arial';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
        return;
      }

      // Draw player with shield effect
      ctx.fillStyle = 'lime';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      if (player.powerUps.shield) {
        ctx.strokeStyle = 'purple';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x + player.width/2, player.y + player.height/2, 
                player.width/2 + 10, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw power-ups
      powerUps.forEach(powerUp => {
        ctx.fillStyle = POWERUP_TYPES[powerUp.type].color;
        ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
      });

      // Draw bullets
      ctx.fillStyle = 'yellow';
      bullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });

      // Draw enemies
      ctx.fillStyle = 'red';
      enemies.forEach(enemy => {
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
      });

      // Draw explosions
      explosions.forEach(explosion => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 165, 0, ${explosion.life})`;
        ctx.arc(explosion.x, explosion.y, explosion.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw HUD
      ctx.fillStyle = 'white';
      ctx.font = '20px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 10, 30);
      ctx.fillText(`Lives: ${lives}`, 10, 60);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
