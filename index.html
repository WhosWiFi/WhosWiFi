<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhosWiFi</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #8d65bd);
      background-size: 400% 400%;
      animation: gradientMove 20s infinite alternate;
    }

    h1 {
      font-size: 3rem;
      text-align: center;
      color: white;
      margin: 0;
      padding: 25rem;
    }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>
  <h1>WhosWiFi</h1>
</body>
</html>
