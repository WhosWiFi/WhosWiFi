<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Animations</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            margin: 0;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #64ffda;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.5);
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <script src="https://unpkg.com/motion"></script>
    <script>
        const { animate } = Motion;

        animate(".box", 
            { 
                scale: [1, 1.2, 1],
                rotate: [0, 180, 0],
                borderRadius: ["0%", "50%", "0%"]
            }, 
            { 
                duration: 2,
                repeat: Infinity,
                ease: "easeInOut"
            }
        );

        console.log("Box animation initialized");
    </script>
</body>
</html>
