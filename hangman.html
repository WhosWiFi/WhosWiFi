<!DOCTYPE html>
<html>
<head>
  <title>Hangman</title>
  <style>
    body {
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1a1a1a;
      color: #64ffd9;
    }
    
    #game-container {
      text-align: center;
      margin-top: 2rem;
    }
    
    #word-display {
      font-size: 2.5rem;
      letter-spacing: 0.5rem;
      margin: 2rem 0;
    }
    
    #guesses {
      font-size: 1.2rem;
      margin: 1rem 0;
    }
    
    #guess-input {
      font-size: 1.2rem;
      width: 30px;
      text-align: center;
      background: transparent;
      border: 2px solid #64ffd9;
      color: #64ffd9;
      padding: 5px;
      margin: 1rem 0;
    }
    
    #message {
      font-size: 1.5rem;
      margin: 1rem 0;
      min-height: 2rem;
    }
    
    button {
      font-family: 'Share Tech Mono', monospace;
      background: transparent;
      border: 2px solid #64ffd9;
      color: #64ffd9;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      margin: 0.5rem;
    }
    
    button:hover {
      background: rgba(100, 255, 217, 0.1);
    }
    
    #hangman-drawing {
      font-family: monospace;
      white-space: pre;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <h1>Hangman</h1>
  <div id="game-container">
    <div id="hangman-drawing"></div>
    <div id="word-display"></div>
    <div id="guesses">Guessed letters: </div>
    <input type="text" id="guess-input" maxlength="1" />
    <div id="message"></div>
    <button id="new-game">New Game</button>
  </div>

  <script>
    let word = '';
    let guessedLetters = new Set();
    let remainingGuesses = 6;
    const hangmanStages = [
      `
  +---+
  |   |
      |
      |
      |
      |
=========`,
      `
  +---+
  |   |
  O   |
      |
      |
      |
=========`,
      `
  +---+
  |   |
  O   |
  |   |
      |
      |
=========`,
      `
  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
      `
  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
      `
  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
      `
  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`
    ];

    async function getNewWord() {
      try {
        const response = await fetch('/api/word');
        const data = await response.json();
        return data.word.toLowerCase();
      } catch (error) {
        console.error('Error fetching word:', error);
        return 'error';
      }
    }

    function updateDisplay() {
      // Update word display
      const display = word
        .split('')
        .map(letter => guessedLetters.has(letter) ? letter : '_')
        .join(' ');
      document.getElementById('word-display').textContent = display;
      
      // Update guessed letters
      document.getElementById('guesses').textContent = 
        'Guessed letters: ' + Array.from(guessedLetters).join(', ');
      
      // Update hangman drawing
      document.getElementById('hangman-drawing').textContent = 
        hangmanStages[6 - remainingGuesses];
    }

    async function startNewGame() {
      word = await getNewWord();
      guessedLetters.clear();
      remainingGuesses = 6;
      document.getElementById('message').textContent = '';
      document.getElementById('guess-input').value = '';
      document.getElementById('guess-input').disabled = false;
      updateDisplay();
    }

    function makeGuess(letter) {
      if (letter.length !== 1) return;
      letter = letter.toLowerCase();
      
      if (guessedLetters.has(letter)) {
        document.getElementById('message').textContent = 'You already guessed that letter!';
        return;
      }
      
      guessedLetters.add(letter);
      
      if (!word.includes(letter)) {
        remainingGuesses--;
      }
      
      updateDisplay();
      
      // Check win/lose conditions
      if (remainingGuesses === 0) {
        document.getElementById('message').textContent = `Game Over! The word was: ${word}`;
        document.getElementById('guess-input').disabled = true;
      } else if ([...word].every(letter => guessedLetters.has(letter))) {
        document.getElementById('message').textContent = 'Congratulations! You won!';
        document.getElementById('guess-input').disabled = true;
      }
    }

    // Event Listeners
    document.getElementById('new-game').addEventListener('click', startNewGame);
    
    document.getElementById('guess-input').addEventListener('keyup', (event) => {
      if (event.key === 'Enter' && event.target.value) {
        makeGuess(event.target.value);
        event.target.value = '';
      }
    });

    // Start first game
    startNewGame();
  </script>
</body>
</html>
