<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <style>
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
        }

        #board {
            width: 640px;
            height: 640px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 2px solid #333;
        }

        .square {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .light { background-color: #eee; }
        .dark { background-color: #999; }
        .selected { background-color: #afd; }
        .valid-move { background-color: #fda; }

        .piece {
            font-size: 50px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
    <script src="/stockfish.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="controls">
            <button class="control-btn" onclick="startNewGame('white')">Play as White</button>
            <button class="control-btn" onclick="startNewGame('black')">Play as Black</button>
        </div>
        <div id="board"></div>
        <div id="status"></div>
    </div>

    <script>
        class ChessGame {
            constructor() {
                this.board = {};
                this.currentPlayer = 'white';
                this.initializeBoard();
            }

            initializeBoard() {
                // Initialize white pieces
                this.board['A1'] = { type: 'rook', color: 'white', hasMoved: false };
                this.board['B1'] = { type: 'knight', color: 'white' };
                this.board['C1'] = { type: 'bishop', color: 'white' };
                this.board['D1'] = { type: 'queen', color: 'white' };
                this.board['E1'] = { type: 'king', color: 'white', hasMoved: false };
                this.board['F1'] = { type: 'bishop', color: 'white' };
                this.board['G1'] = { type: 'knight', color: 'white' };
                this.board['H1'] = { type: 'rook', color: 'white', hasMoved: false };

                for (let file of 'ABCDEFGH') {
                    this.board[file + '2'] = { type: 'pawn', color: 'white', hasMoved: false };
                }

                // Initialize black pieces
                this.board['A8'] = { type: 'rook', color: 'black', hasMoved: false };
                this.board['B8'] = { type: 'knight', color: 'black' };
                this.board['C8'] = { type: 'bishop', color: 'black' };
                this.board['D8'] = { type: 'queen', color: 'black' };
                this.board['E8'] = { type: 'king', color: 'black', hasMoved: false };
                this.board['F8'] = { type: 'bishop', color: 'black' };
                this.board['G8'] = { type: 'knight', color: 'black' };
                this.board['H8'] = { type: 'rook', color: 'black', hasMoved: false };

                for (let file of 'ABCDEFGH') {
                    this.board[file + '7'] = { type: 'pawn', color: 'black', hasMoved: false };
                }
            }

            isValidMove(from, to) {
                const piece = this.board[from];
                if (!piece || piece.color !== this.currentPlayer) return false;
                
                // Can't capture your own pieces
                if (this.board[to] && this.board[to].color === piece.color) return false;

                const [fromFile, fromRank] = [from.charCodeAt(0) - 65, parseInt(from[1])];
                const [toFile, toRank] = [to.charCodeAt(0) - 65, parseInt(to[1])];
                const fileDiff = Math.abs(toFile - fromFile);
                const rankDiff = Math.abs(toRank - fromRank);

                switch (piece.type) {
                    case 'pawn':
                        const direction = piece.color === 'white' ? 1 : -1;
                        
                        // Forward movement (no capture)
                        if (fileDiff === 0 && !this.board[to]) {
                            // Normal one square forward move
                            if (rankDiff === 1 && (toRank - fromRank) === direction) {
                                return true;
                            }
                            // First move - two squares forward
                            if (!piece.hasMoved && rankDiff === 2 && 
                                (toRank - fromRank) === 2 * direction) {
                                const middleSquare = from[0] + (parseInt(from[1]) + direction);
                                return !this.board[middleSquare];
                            }
                        }
                        
                        // Diagonal capture
                        if (fileDiff === 1 && rankDiff === 1 && 
                            (toRank - fromRank) === direction) {
                            return this.board[to] && this.board[to].color !== piece.color;
                        }
                        return false;

                    case 'knight':
                        // L-shaped movement (2+1)
                        return (fileDiff === 2 && rankDiff === 1) || 
                               (fileDiff === 1 && rankDiff === 2);

                    case 'bishop':
                        // Diagonal movement only
                        if (fileDiff !== rankDiff) return false;
                        return this.isDiagonalPathClear(from, to);

                    case 'rook':
                        // Horizontal or vertical movement only
                        if (fileDiff !== 0 && rankDiff !== 0) return false;
                        return this.isStraightPathClear(from, to);

                    case 'queen':
                        // Combination of bishop and rook movements
                        if (fileDiff === rankDiff) return this.isDiagonalPathClear(from, to);
                        if (fileDiff === 0 || rankDiff === 0) return this.isStraightPathClear(from, to);
                        return false;

                    case 'king':
                        // One square in any direction
                        return fileDiff <= 1 && rankDiff <= 1;
                }
                return false;
            }

            makeMove(from, to) {
                if (!this.isValidMove(from, to)) return false;
                
                const piece = this.board[from];
                
                // Update hasMoved status for pawns, kings, and rooks
                if (piece.type === 'pawn' || piece.type === 'king' || piece.type === 'rook') {
                    piece.hasMoved = true;
                }
                
                this.board[to] = piece;
                delete this.board[from];
                this.currentPlayer = this.currentPlayer === 'white' ? 'black' : 'white';
                return true;
            }

            isDiagonalPathClear(from, to) {
                const [fromFile, fromRank] = [from.charCodeAt(0) - 65, parseInt(from[1])];
                const [toFile, toRank] = [to.charCodeAt(0) - 65, parseInt(to[1])];
                const fileDir = Math.sign(toFile - fromFile);
                const rankDir = Math.sign(toRank - fromRank);

                let currentFile = fromFile + fileDir;
                let currentRank = fromRank + rankDir;

                while (currentFile !== toFile && currentRank !== toRank) {
                    const square = String.fromCharCode(currentFile + 65) + currentRank;
                    if (this.board[square]) return false;
                    currentFile += fileDir;
                    currentRank += rankDir;
                }
                return true;
            }

            isStraightPathClear(from, to) {
                const [fromFile, fromRank] = [from.charCodeAt(0), parseInt(from[1])];
                const [toFile, toRank] = [to.charCodeAt(0), parseInt(to[1])];

                if (fromFile === toFile) {
                    const dir = Math.sign(toRank - fromRank);
                    for (let rank = fromRank + dir; rank !== toRank; rank += dir) {
                        if (this.board[String.fromCharCode(fromFile) + rank]) return false;
                    }
                } else {
                    const dir = Math.sign(toFile - fromFile);
                    for (let file = fromFile + dir; file !== toFile; file += dir) {
                        if (this.board[String.fromCharCode(file) + fromRank]) return false;
                    }
                }
                return true;
            }
        }

        let game;
        let selectedSquare = null;
        let engine = null;
        let playerColor = 'white';
        let isPlayerTurn = true;

        function initializeEngine() {
            engine = new Worker('/stockfish.js');
            engine.onmessage = function(event) {
                const message = event.data;
                if (message.startsWith('bestmove')) {
                    const move = message.split(' ')[1];
                    const from = move.substring(0, 2).toUpperCase();
                    const to = move.substring(2, 4).toUpperCase();
                    
                    if (game.makeMove(from, to)) {
                        createBoard();
                        isPlayerTurn = true;
                        updateStatus();
                    }
                }
            };
            
            engine.postMessage('uci');
            engine.postMessage('isready');
            engine.postMessage('ucinewgame');
            engine.postMessage('setoption name Skill Level value 10');
        }

        function startNewGame(color) {
            playerColor = color;
            game = new ChessGame();
            selectedSquare = null;
            isPlayerTurn = (color === 'white');
            createBoard();
            updateStatus();

            if (color === 'black') {
                makeEngineMove();
            }
        }

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            for (let rank = 8; rank >= 1; rank--) {
                for (let file of 'ABCDEFGH') {
                    const square = document.createElement('div');
                    const notation = file + rank;
                    square.className = `square ${(file.charCodeAt(0) + rank) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.square = notation;

                    const piece = game.board[notation];
                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `piece ${piece.color}`;
                        pieceDiv.textContent = getPieceSymbol(piece);
                        square.appendChild(pieceDiv);
                    }

                    square.addEventListener('click', handleSquareClick);
                    board.appendChild(square);
                }
            }
        }

        function handleSquareClick(event) {
            if (!isPlayerTurn) return;

            const square = event.currentTarget;
            const notation = square.dataset.square;

            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('selected', 'valid-move');
            });

            if (selectedSquare) {
                if (game.makeMove(selectedSquare, notation)) {
                    createBoard();
                    isPlayerTurn = false;
                    updateStatus();
                    setTimeout(makeEngineMove, 500);
                }
                selectedSquare = null;
            } else {
                const piece = game.board[notation];
                if (piece && piece.color === playerColor) {
                    selectedSquare = notation;
                    square.classList.add('selected');
                }
            }
        }

        function makeEngineMove() {
            const fen = getCurrentFEN();
            engine.postMessage(`position fen ${fen}`);
            engine.postMessage(`go movetime 1000`);
        }

        function getCurrentFEN() {
            let fen = '';
            let emptyCount = 0;
            
            for (let rank = 8; rank >= 1; rank--) {
                for (let file of 'ABCDEFGH') {
                    const piece = game.board[file + rank];
                    if (piece) {
                        if (emptyCount > 0) {
                            fen += emptyCount;
                            emptyCount = 0;
                        }
                        const symbol = getPieceFENSymbol(piece);
                        fen += symbol;
                    } else {
                        emptyCount++;
                    }
                }
                if (emptyCount > 0) {
                    fen += emptyCount;
                    emptyCount = 0;
                }
                if (rank > 1) fen += '/';
            }
            
            fen += ` ${game.currentPlayer.charAt(0)} - - 0 1`;
            return fen;
        }

        function getPieceSymbol(piece) {
            const symbols = {
                white: { king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙' },
                black: { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
            };
            return symbols[piece.color][piece.type];
        }

        function getPieceFENSymbol(piece) {
            const symbols = {
                king: 'k', queen: 'q', rook: 'r',
                bishop: 'b', knight: 'n', pawn: 'p'
            };
            let symbol = symbols[piece.type];
            return piece.color === 'white' ? symbol.toUpperCase() : symbol;
        }

        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `Current turn: ${game.currentPlayer.toUpperCase()}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeEngine();
            startNewGame('white');
        });
    </script>
</body>
</html>
