<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi's Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-text-color: #64ffda;
            --neon-border-color: #08f;
        }

        body {
            margin: 0;
            padding-top: 60px;
            background-color: #0a0a0a;
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .nav-links {
            display: flex;
            justify-content: stretch;
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            border-bottom: 1px solid var(--neon-text-color);
        }

        .nav-links li {
            position: relative;
            flex: 1;
            text-align: center;
        }

        .nav-links a {
            color: var(--neon-text-color);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            padding: 1rem 0;
            display: block;
            width: 100%;
        }

        .game-container {
            margin-top: 20px;
            position: relative;
        }

        #gameCanvas {
            border: 2px solid var(--neon-text-color);
            background-color: rgba(0, 0, 0, 0.8);
        }

        .game-info {
            position: absolute;
            left: 100%;
            top: 0;
            margin-left: 20px;
            padding: 10px;
            border: 1px solid var(--neon-text-color);
            background-color: rgba(0, 0, 0, 0.8);
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        .score {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid var(--neon-text-color);
            text-align: center;
            display: none;
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-text-color);
            color: var(--neon-text-color);
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
        }

        button:hover {
            background: rgba(100, 255, 218, 0.1);
        }
    </style>
</head>
<body>
    <nav>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/apps">Apps</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/shop">Shop</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/login">Login/Register</a></li>
        </ul>
    </nav>

    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="controls">
                <p>Controls:</p>
                <p>← → : Move</p>
                <p>↓ : Soft Drop</p>
                <p>↑ : Rotate</p>
                <p>Space : Hard Drop</p>
            </div>
            <button onclick="resetGame()">New Game</button>
        </div>
        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const BLOCK_SIZE = 30;
        const GRID_WIDTH = 10;
        const GRID_HEIGHT = 20;
        
        let score = 0;
        let grid = Array(GRID_HEIGHT).fill().map(() => Array(GRID_WIDTH).fill(0));
        let gameLoop;
        let currentPiece;
        let gameOver = false;

        const PIECES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 0], [1, 0], [1, 1]], // L
            [[0, 1], [0, 1], [1, 1]], // J
            [[1, 1, 0], [0, 1, 1]], // S
            [[0, 1, 1], [1, 1, 0]] // Z
        ];

        const COLORS = [
            '#FF0D72', '#0DC2FF', '#0DFF72',
            '#F538FF', '#FF8E0D', '#FFE138',
            '#3877FF'
        ];

        class Piece {
            constructor(shape, color) {
                this.shape = shape;
                this.color = color;
                this.x = Math.floor(GRID_WIDTH / 2) - Math.floor(shape[0].length / 2);
                this.y = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                this.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            ctx.fillRect(
                                (this.x + x) * BLOCK_SIZE,
                                (this.y + y) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    });
                });
            }

            move(dx, dy) {
                this.x += dx;
                this.y += dy;
                if (this.collision()) {
                    this.x -= dx;
                    this.y -= dy;
                    return false;
                }
                return true;
            }

            collision() {
                return this.shape.some((row, y) => {
                    return row.some((value, x) => {
                        if (!value) return false;
                        const newX = this.x + x;
                        const newY = this.y + y;
                        return newX < 0 || newX >= GRID_WIDTH ||
                               newY >= GRID_HEIGHT ||
                               (newY >= 0 && grid[newY][newX]);
                    });
                });
            }

            rotate() {
                const newShape = this.shape[0].map((_, i) =>
                    this.shape.map(row => row[i]).reverse()
                );
                const oldShape = this.shape;
                this.shape = newShape;
                if (this.collision()) {
                    this.shape = oldShape;
                }
            }
        }

        function createPiece() {
            const pieceIndex = Math.floor(Math.random() * PIECES.length);
            return new Piece(PIECES[pieceIndex], COLORS[pieceIndex]);
        }

        function drawGrid() {
            grid.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        ctx.fillStyle = COLORS[value - 1];
                        ctx.fillRect(
                            x * BLOCK_SIZE,
                            y * BLOCK_SIZE,
                            BLOCK_SIZE - 1,
                            BLOCK_SIZE - 1
                        );
                    }
                });
            });
        }

        function merge() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const pieceY = currentPiece.y + y;
                        if (pieceY < 0) {
                            gameOver = true;
                            return;
                        }
                        grid[pieceY][currentPiece.x + x] = COLORS.indexOf(currentPiece.color) + 1;
                    }
                });
            });
        }

        function clearLines() {
            let linesCleared = 0;
            outer: for (let y = GRID_HEIGHT - 1; y >= 0; y--) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (!grid[y][x]) continue outer;
                }
                grid.splice(y, 1);
                grid.unshift(Array(GRID_WIDTH).fill(0));
                linesCleared++;
                y++;
            }
            if (linesCleared > 0) {
                score += linesCleared * 100;
                document.getElementById('score').textContent = score;
            }
        }

        function update() {
            if (!currentPiece.move(0, 1)) {
                merge();
                if (gameOver) {
                    endGame();
                    return;
                }
                clearLines();
                currentPiece = createPiece();
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            currentPiece.draw();
        }

        function resetGame() {
            grid = Array(GRID_HEIGHT).fill().map(() => Array(GRID_WIDTH).fill(0));
            score = 0;
            document.getElementById('score').textContent = score;
            gameOver = false;
            document.getElementById('gameOver').style.display = 'none';
            currentPiece = createPiece();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 1000);
        }

        function endGame() {
            clearInterval(gameLoop);
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
        }

        document.addEventListener('keydown', event => {
            if (gameOver) return;
            switch (event.keyCode) {
                case 37: // Left
                    currentPiece.move(-1, 0);
                    break;
                case 39: // Right
                    currentPiece.move(1, 0);
                    break;
                case 40: // Down
                    currentPiece.move(0, 1);
                    break;
                case 38: // Up
                    currentPiece.rotate();
                    break;
                case 32: // Space
                    while (currentPiece.move(0, 1)) {}
                    break;
            }
            draw();
        });

        resetGame();
    </script>
</body>
</html>
