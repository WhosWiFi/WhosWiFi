<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - WhosWiFi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <script>
    // Immediately start checking login status
    const authCheck = fetch('/login/check', {
      credentials: 'include'
    }).then(res => res.json());

    // This will run before the page content loads
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const data = await authCheck; // Use the promise we started earlier
        const navLinks = document.querySelector('.nav-links');
        const loginItem = navLinks.querySelector('li:last-child');
        
        if (data.loggedIn) {
          loginItem.innerHTML = '<a href="#" onclick="handleLogout(event)">Logout</a>';
        }
      } catch (error) {
        console.error('Error checking login status:', error);
      }
    });

    // Define logout handler globally
    function handleLogout(event) {
      event.preventDefault();
      fetch('/logout', {
        credentials: 'include'
      }).then(response => {
        if (response.ok) {
          window.location.href = '/';
        }
      }).catch(error => {
        console.error('Error during logout:', error);
      });
    }
  </script>
  <style>
    :root {
      --neon-text-color: #64ffda;
      --neon-border-color: #08f;
    }

    body {
      margin: 0;
      padding-top: 60px;
      background-color: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      justify-content: stretch;
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .nav-links li {
      position: relative;
      flex: 1;
      text-align: center;
    }

    .nav-links li:not(:last-child)::after {
      content: "||";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-text-color);
      opacity: 0.5;
    }

    .nav-links a {
      color: var(--neon-text-color);
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      padding: 1rem 0;
      display: block;
      width: 100%;
    }

    .nav-links a:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .container {
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--neon-text-color);
    }

    .container::before {
      content: "[NEW USER REGISTRATION]";
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.7rem;
      opacity: 0.5;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      font-family: 'Share Tech Mono', monospace;
      margin-bottom: 1.5rem;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 5px var(--neon-text-color);
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: transparent;
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .login-link {
      margin-top: 15px;
      display: block;
      color: var(--neon-text-color);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .login-link:hover {
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    h2 {
      color: var(--neon-text-color);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      text-align: left;
    }

    .error-message {
      color: #ff4444;
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: 1px solid #ff4444;
      display: none;
    }

    .success-message {
      color: var(--neon-text-color);
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: 1px solid var(--neon-text-color);
      display: none;
    }

    @media (max-width: 768px) {
      .nav-links {
        flex-wrap: wrap;
      }

      .nav-links li {
        flex: 1 1 auto;
        min-width: 33.33%;
      }

      .container {
        width: 85%;
        min-height: 350px;
        margin: 2rem;
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/apps">Apps</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/login">Login/Register</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>[ REGISTER ]</h2>
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    <form id="registerForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">CREATE ACCOUNT</button>
    </form>
    <a href="/login" class="login-link">[ Already have an account? Login here ]</a>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        
        if (result.success) {
          successMessage.textContent = result.message || 'Registration successful!';
          successMessage.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          errorMessage.textContent = result.message || 'Registration failed';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        errorMessage.textContent = 'An error occurred during registration';
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
