<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* Copy the styles from your login.html */
    /* ... existing styles ... */

    .error-message {
      color: #ff4444;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
    }

    .success-message {
      color: var(--neon-text-color);
      margin-bottom: 1rem;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/apps">Apps</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/login">Login/Register</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>[ REGISTER ]</h2>
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    <form id="registerForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">CREATE ACCOUNT</button>
    </form>
    <p class="switch-form" onclick="window.location.href='/login'">[ Already have an account? Login here ]</p>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      
      // Hide any existing messages
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        
        if (result.success) {
          successMessage.textContent = result.message || 'Registration successful!';
          successMessage.style.display = 'block';
          // Redirect to login page after 2 seconds
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          errorMessage.textContent = result.message || 'Registration failed';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        errorMessage.textContent = 'An error occurred during registration';
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
