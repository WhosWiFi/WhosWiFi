<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register - WhosWiFi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-text-color: #64ffda;
      --neon-border-color: #08f;
    }

    body {
      margin: 0;
      padding-top: 60px;
      background-color: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-text-color);
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      justify-content: stretch;
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .nav-links li {
      position: relative;
      flex: 1;
      text-align: center;
    }

    .nav-links li:not(:last-child)::after {
      content: "||";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-text-color);
      opacity: 0.5;
    }

    .nav-links a {
      color: var(--neon-text-color);
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      padding: 1rem 0;
      display: block;
      width: 100%;
    }

    .nav-links a:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .auth-container {
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--neon-text-color);
    }

    .auth-tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      color: var(--neon-text-color);
      background: transparent;
      border: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .auth-form {
      background: rgba(0, 0, 0, 0.3);
      padding: 2rem;
      border: 1px solid var(--neon-text-color);
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.5rem;
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      font-family: 'Share Tech Mono', monospace;
    }

    .form-group input:focus {
      outline: none;
      box-shadow: 0 0 5px var(--neon-text-color);
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: transparent;
      border: 1px solid var(--neon-text-color);
      color: var(--neon-text-color);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: rgba(100, 255, 218, 0.1);
      text-shadow: 0 0 5px var(--neon-text-color);
    }

    .security-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
    }

    .error-message {
      color: #ff4444;
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: 1px solid #ff4444;
      display: none;
    }

    @media (max-width: 768px) {
      /* Fix navigation wrapping */
      .nav-links {
        flex-wrap: wrap;
      }

      .nav-links li {
        flex: 1 1 auto;
        min-width: 33.33%; /* Show 3 items per row */
      }

      /* Adjust terminal container */
      .terminal-container {
        height: calc(100vh - 120px); /* Account for wrapped nav */
        padding: 1rem;
      }

      /* Adjust terminal text container */
      .terminal-text {
        width: 95%;
        height: 60vh;
        padding: 1rem;
        transform: none; /* Remove perspective on mobile */
      }

      /* Adjust title */
      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }

      /* Adjust boot sequence text */
      .boot-sequence {
        font-size: 0.9rem;
      }

      /* Fix input area */
      .prompt-line {
        font-size: 0.9rem;
      }

      .prompt-line::before {
        margin-right: 0.5rem;
      }

      #terminal-input {
        font-size: 0.9rem;
      }
    }

    /* Fix iOS height issues */
    @supports (-webkit-touch-callout: none) {
      .terminal-container {
        height: -webkit-fill-available;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/apps">Apps</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/login">Login/Register</a></li>
    </ul>
  </nav>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">[ LOGIN ]</button>
      <button class="auth-tab" onclick="switchTab('register')">[ REGISTER ]</button>
    </div>

    <div class="error-message" id="error-message"></div>

    <form class="auth-form active" id="login-form">
      <div class="form-group">
        <label for="login-username">Username:</label>
        <input type="text" id="login-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password" required>
      </div>
      <button type="submit" class="submit-btn">[ AUTHENTICATE ]</button>
    </form>

    <form class="auth-form" id="registerForm">
      <div class="form-group">
        <label for="register-username">Username:</label>
        <input type="text" id="register-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="register-password">Password:</label>
        <input type="password" id="register-password" name="password" required>
      </div>
      <div class="form-group">
        <label for="register-confirm">Confirm Password:</label>
        <input type="password" id="register-confirm" name="confirm" required>
      </div>
      <button type="submit" class="submit-btn">[ CREATE ACCOUNT ]</button>
    </form>
  </div>

  <script>
    function switchTab(tab) {
      // Remove active class from all tabs and forms
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      
      // Add active class to selected tab and form
      document.querySelector(`.auth-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      if (tab === 'login') {
        document.getElementById('login-form').classList.add('active');
      } else {
        document.getElementById('registerForm').classList.add('active');
      }
    }

    // Fix the form IDs and input IDs in the event listeners
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await response.json();
      if(result.success) {
        window.location.href = `/`;
      }
      if (!result.success) {
        alert('Invalid login credentials');
      }
    });

    const registrationForm = document.getElementById('registerForm');
    registrationForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const username = document.getElementById('register-username').value;
      const password = document.getElementById('register-password').value;

      const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await response.json();
      if (result.success) {
        alert('Registration successful! You can now log in.');
      } else {
        alert('Username already exists');
      }
    });
  </script>
</body>
</html>
