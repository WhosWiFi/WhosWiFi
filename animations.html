<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Animations</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            margin: 0;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #64ffda;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.5);
            opacity: 0; /* Start invisible */
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <!-- Use the specific version as recommended in docs -->
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
    <script>
        // Destructure from Motion global variable as shown in docs
        const { animate, spring } = Motion;

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Starting animation...');
            
            // Animate using spring type for more natural motion
            animate(
                ".box",
                { 
                    opacity: [0, 1],
                    scale: [0.4, 1],
                    rotate: [0, 360]
                },
                { 
                    type: "spring",
                    stiffness: 300,
                    duration: 2,
                    repeat: Infinity,
                    repeatDelay: 1
                }
            );
        });
    </script>
</body>
</html>
